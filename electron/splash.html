<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; font-src 'self' file:">
<title>Creator Asset Assistant</title>
<style>
  @font-face { font-family: "Asset Display"; src: url("../ui/fonts/asset-display.ttf") format("truetype"); }
  :root { color-scheme: light; --line: #b9b9b9; --ink: #0e0e0e; --accent: #ff6d1f; --mono: "JetBrains Mono", "Cascadia Mono", "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; }
  html, body { height: 100%; margin: 0; }
  [hidden] { display: none !important; }
  body { background: #e4e4e4; color: var(--ink); font: 13px/1.55 var(--mono); display: grid; grid-template-rows: 64px 1fr; -webkit-font-smoothing: antialiased; }
  .bar { -webkit-app-region: drag; display: flex; align-items: center; gap: 8px; padding-left: 22px; margin: 0 24px; border-bottom: 1px solid var(--line); }
  .tl { -webkit-app-region: no-drag; width: 12px; height: 12px; border-radius: 50%; border: 0; padding: 0; cursor: pointer; }
  .c { background: #ff5f57; } .m { background: #febc2e; } .x { background: #28c840; }
  main { margin: 0 24px; border-left: 1px solid var(--line); border-right: 1px solid var(--line); display: grid; place-items: center; padding: 24px; position: relative;
    background: linear-gradient(var(--line), var(--line)) 25% 0 / 1px 100% no-repeat, linear-gradient(var(--line), var(--line)) 50% 0 / 1px 100% no-repeat, linear-gradient(var(--line), var(--line)) 75% 0 / 1px 100% no-repeat; }
  .card { background: #f6f6f6; border: 1px solid var(--line); padding: 34px 38px 32px; max-width: 560px; position: relative; }
  .card::before, .card::after { content: ""; position: absolute; width: 10px; height: 10px; background: var(--accent); top: -6px; }
  .card::before { left: -6px; } .card::after { right: -6px; }
  .label { display: flex; align-items: center; gap: 12px; text-transform: uppercase; letter-spacing: 0.08em; font-size: 12px; }
  .label i { width: 8px; height: 8px; background: var(--accent); }
  h1 { margin: 22px 0 14px; font: 400 54px/0.8 "Asset Display", var(--mono); text-transform: uppercase; }
  p { margin: 0; color: #555; }
  .loader { display: flex; gap: 6px; margin-top: 24px; }
  .loader i { width: 10px; height: 10px; background: var(--accent); animation: b 1.2s steps(1) infinite; opacity: 0.2; }
  .loader i:nth-child(2) { animation-delay: 0.2s; } .loader i:nth-child(3) { animation-delay: 0.4s; } .loader i:nth-child(4) { animation-delay: 0.6s; }
  @keyframes b { 0%, 40% { opacity: 1; } 41%, 100% { opacity: 0.2; } }
  .err { color: #d4382a; margin-top: 16px; overflow-wrap: anywhere; }
  .actions { display: flex; gap: 10px; margin-top: 22px; }
  button.b { height: 38px; padding: 0 20px; border: 0; font: 500 12.5px/1 var(--mono); letter-spacing: 0.06em; text-transform: uppercase; cursor: pointer; }
  .primary { background: var(--accent); color: var(--ink); clip-path: polygon(9px 0, 100% 0, 100% calc(100% - 9px), calc(100% - 9px) 100%, 0 100%, 0 9px); }
  .ghost { background: #f6f6f6; color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
  code { font: 12px var(--mono); background: #fff; border: 1px solid #d2d2d2; padding: 0 5px; }
  @media (prefers-reduced-motion: reduce) { .loader i { animation: none; opacity: 1; } }
</style>
</head>
<body>
<div class="bar">
  <button class="tl c" id="c" aria-label="Close window"></button>
  <button class="tl m" id="m" aria-label="Minimize window"></button>
  <button class="tl x" id="x" aria-label="Maximize window"></button>
</div>
<main>
  <div class="card">
    <span class="label"><i></i>Creator Asset Assistant</span>
    <h1 id="title">Starting</h1>
    <p id="msg">Loading your library and the local models.</p>
    <div class="loader" id="spin"><i></i><i></i><i></i><i></i></div>
    <div id="error" hidden>
      <p class="err" id="errText"></p>
      <p style="margin-top:10px" id="hint">If this is the first run, run <code>scripts\setup.ps1</code> from the project folder, then try again.</p>
      <div class="actions"><button class="b primary" id="retry">Try again</button><button class="b ghost" id="log">Open log</button></div>
    </div>
  </div>
</main>
<script>
  const d = window.caaDesktop;
  const q = new URLSearchParams(location.search);
  document.getElementById("c").onclick = () => d && d.close();
  document.getElementById("m").onclick = () => d && d.minimize();
  document.getElementById("x").onclick = () => d && d.toggleMaximize();
  if (q.get("error")) {
    document.getElementById("title").textContent = "Engine stopped";
    document.getElementById("msg").hidden = true;
    document.getElementById("spin").hidden = true;
    document.getElementById("error").hidden = false;
    document.getElementById("errText").textContent = q.get("error");
    document.getElementById("retry").onclick = () => d && d.retry();
    document.getElementById("log").onclick = () => d && d.openLog();
    if (!q.get("log")) document.getElementById("log").hidden = true;
    if (q.get("packaged")) document.getElementById("hint").textContent = "Try again, or open the log. If it keeps failing, reinstall Creator Asset Assistant.";
  }
</script>
</body>
</html>
